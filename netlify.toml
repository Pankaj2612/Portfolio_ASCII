# Netlify: connect the repo and it deploys automatically. Set SITE_URL under
# Site settings → Environment variables to get canonical URLs + sitemap.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
